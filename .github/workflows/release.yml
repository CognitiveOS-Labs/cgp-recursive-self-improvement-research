name: Release paper

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Encapsulated Alpine environment — same distro CognitiveOS ships on
    # (see .github/docker/Dockerfile.ci).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build encapsulated Alpine image (xelatex + bibtex)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile.ci
          platforms: linux/amd64
          load: true
          tags: paper-ci:local
      - name: Extract artifacts
        run: |
          id=$(docker create paper-ci:local)
          docker cp "$id":/out ./out
          docker rm "$id"
          ls -la out/
      - name: Create GitHub Release (triggers Zenodo DOI)
        uses: softprops/action-gh-release@v2
        with:
          files: out/main.pdf
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
