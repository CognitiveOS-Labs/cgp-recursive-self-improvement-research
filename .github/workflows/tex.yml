name: Build paper

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  build:
    # Encapsulated Alpine environment — same distro CognitiveOS ships on
    # (see .github/docker/Dockerfile.ci). No ubuntu TeX Live drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build encapsulated Alpine image (xelatex + bibtex)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile.ci
          platforms: linux/amd64
          load: true
          tags: paper-ci:local
      - name: Extract artifacts
        run: |
          id=$(docker create paper-ci:local)
          docker cp "$id":/out ./out
          docker rm "$id"
          ls -la out/
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: out/main.pdf
          if-no-files-found: error
      - name: Upload arXiv submission
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-submission
          path: out/arxiv.tar.gz
          if-no-files-found: warn
